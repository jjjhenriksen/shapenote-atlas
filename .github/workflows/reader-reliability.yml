name: Reader reliability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Image integration fixture dependency
        run: python3 -m pip install Pillow==11.3.0 numpy==2.0.2
      - name: Clone-safe semantic and evidence fixtures
        run: |
          python3 -m unittest discover -s tests -p test_agent_03_semantic_musicxml.py
          python3 -m unittest discover -s tests -p test_transcription_bundle_import.py
          python3 -m unittest discover -s tests -p test_agent_07_additions_audit.py
          python3 -m unittest discover -s tests -p test_shape_evidence.py
          python3 -m unittest discover -s tests -p test_trumpet_catalogue_review.py
          python3 -m unittest discover -s tests -p 'test_sh1991_*.py'
          python3 -m unittest discover -s tests -p 'test_omr_grid_*.py'
          python3 -m unittest discover -s tests -p 'test_omr_image_*.py'
          python3 -m unittest discover -s tests -p 'test_omr_measure_*.py'
          python3 -m unittest discover -s tests -p 'test_omr_terminal_*.py'
          python3 -m unittest discover -s tests -p 'test_omr_localization_*.py'
          python3 -m unittest discover -s tests -p 'test_omr_exemplar_*.py'
          python3 -m unittest discover -s tests -p test_agent_10_reproducible_validation.py
      - run: npm run validate-playback && npm run validate-transposition
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-browser-evidence
          path: work/browser-tests
          if-no-files-found: ignore
